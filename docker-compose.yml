services:
  db:
    image: postgres:16-alpine
    container_name: ngcs-postgres
    environment:
      POSTGRES_USER: ngcs
      POSTGRES_PASSWORD: ngcs
      POSTGRES_DB: ngcs
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngcs"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ngcs-network
    restart: unless-stopped

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: runtime
    container_name: ngcs-backend
    environment:
      DATABASE_URL: postgresql://ngcs:ngcs@db:5432/ngcs
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      NODE_ENV: production
      PERSISTENT_SESSIONS_ENABLED: ${PERSISTENT_SESSIONS_ENABLED:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
    ports:
      - "9001:4000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ngcs-network
    restart: unless-stopped

  migrator:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgresql://ngcs:ngcs@db:5432/ngcs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ngcs-network
    profiles:
      - operations
    restart: "no"

volumes:
  pgdata:

networks:
  ngcs-network:
    driver: bridge
